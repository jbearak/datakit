name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true

  # dtatools (in dta-parser) imports datakit's := and colon_equals and
  # checks its Raven sidecar, so its testthat suite runs against this
  # datakit, with dtaparser and dtatools built from dta-parser's main.
  dtatools:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: datakit
      - uses: actions/checkout@v4
        with:
          repository: jbearak/dta-parser
          path: dta-parser
      # dtaparser builds its Rust core with cargo.
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: datakit
          extra-packages: any::pillar, any::tidyselect, any::readstata13, any::dplyr, any::haven, any::testthat
      # dta-parser's dtatools still asks for datakit (>= 3.1.0) from the
      # monorepo's old r/datakit path. This copy is patched to take this
      # datakit (0.0.9000) from this repository until dta-parser is
      # updated; the patch stays in this job's checkout.
      - name: Point dtatools at this datakit
        run: |
          sed -i 's/datakit (>= 3\.1\.0)/datakit (>= 0.0.9000)/' dta-parser/r/dtatools/DESCRIPTION
          sed -i 's#datakit=jbearak/dta-parser/r/datakit#datakit=jbearak/datakit#' dta-parser/r/dtatools/DESCRIPTION
          grep -n datakit dta-parser/r/dtatools/DESCRIPTION
      - name: Install dtaparser, this datakit and dtatools
        run: |
          R CMD INSTALL dta-parser/r/dtaparser
          R CMD INSTALL datakit
          R CMD INSTALL dta-parser/r/dtatools
      # test-docs.R checks that every datakit export appears in
      # dta-parser's docs/r.md, which describes the old datakit until
      # dta-parser is updated (a later step of plan 0001); it is the only
      # file left out.
      - name: dtatools' tests, but test-docs.R
        run: >-
          Rscript -e 'testthat::test_dir("dta-parser/r/dtatools/tests/testthat", package = "dtatools",
          load_package = "installed", filter = "docs", invert = TRUE)'
      # The do2r path with dtaparser's reader and writer, which datakit's
      # own tests cannot use, as datakit does not depend on dtaparser.
      - name: do2r with dtaparser
        run: >-
          Rscript -e 'testthat::test_file("datakit/tools/test-do2r-dtaparser.R", package = "datakit",
          load_package = "installed")'
